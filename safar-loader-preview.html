<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safar Loader Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; }

  .panel {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; gap: 24px;
  }
  .panel.light { background: #fafafa; }
  .panel.dark  { background: #000000; }

  /* ── THE MARK ─────────────────────────────── */
  .mark { width: 150px; height: 145px; }

  .origin-dot {
    transform-origin: 44px 56px;
    animation: pop-in .45s cubic-bezier(.25,.1,.25,1) both;
  }
  .route-path {
    stroke-dasharray: 700; stroke-dashoffset: 700;
    animation: draw 1.1s .15s cubic-bezier(.65,0,.35,1) forwards;
  }
  .pin {
    transform-origin: 184px 150px;
    animation: pin-pop .55s 1.15s cubic-bezier(.34,1.56,.64,1) both,
               pin-pulse 2.4s 1.9s ease-in-out infinite;
  }
  .travel-dot {
    offset-path: path("M44 56 C112 14 202 50 174 102 C148 150 62 128 70 176 C78 222 146 230 178 202");
    offset-rotate: 0deg;
    animation: travel 1.7s 1.8s cubic-bezier(.45,.05,.55,.95) infinite;
    opacity: 0;
  }

  @keyframes draw     { to { stroke-dashoffset: 0; } }
  @keyframes pop-in   { from { transform: scale(0); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes pin-pop  { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pin-pulse{ 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
  @keyframes travel   {
    0%   { offset-distance: 0%;   opacity: 0 }
    8%   { opacity: 1 }
    85%  { opacity: 1 }
    100% { offset-distance: 100%; opacity: 0 }
  }

  /* ── TEXT + SHIMMER BAR ───────────────────── */
  .status-wrap { text-align: center; }
  .status-main { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .status-sub  { font-size: 14px; margin-top: 10px; transition: opacity .3s; }

  .light .status-main { color: #1d1d1f; } .light .status-sub { color: #86868b; }
  .dark  .status-main { color: #f5f5f7; } .dark  .status-sub { color: #a1a1a6; }

  .shimmer {
    width: 170px; height: 3px; border-radius: 2px; margin: 16px auto 0;
    overflow: hidden; position: relative;
  }
  .light .shimmer { background: #e8e8ed; }
  .dark  .shimmer { background: #333336; }
  .shimmer::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, #ff6b35, #ffffff, #138808, transparent);
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%) } to { transform: translateX(100%) } }

  @media (prefers-reduced-motion: reduce) {
    .route-path { stroke-dashoffset: 0; animation: none; }
    .pin, .origin-dot, .travel-dot, .shimmer::after { animation: none; }
    .travel-dot { display: none; }
  }
</style>
</head>
<body>

<div class="panel light">
  <svg class="mark" viewBox="16 6 230 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(-8,0)">
    <path class="route-path" d="M44 56 C112 14 202 50 174 102 C148 150 62 128 70 176 C78 220 150 238 184 162"
          stroke="#1d1d1f" stroke-width="7" stroke-linecap="round"/>
    <circle class="origin-dot" cx="44" cy="56" r="12" fill="#ff6b35"/>
    <g transform="translate(25.8,22.7) scale(0.86)">
      <g class="pin">
        <path d="M184 118 C211.2 118 231.2 138 231.2 162 C231.2 192.8 184 238 184 238 C184 238 136.8 192.8 136.8 162 C136.8 138 156.8 118 184 118 Z"
              fill="#ff6b35"/>
        <circle cx="184" cy="162" r="17" fill="#ffffff"/>
      </g>
    </g>
    <circle class="travel-dot" r="7" fill="#ff6b35"/>
    </g>
  </svg>

  <div class="status-wrap">
    <div class="status-main">Generating your trip…</div>
    <div class="status-sub" id="sub-light">Checking routes…</div>
    <div class="shimmer"></div>
  </div>
</div>

<script>
  const texts = ["Checking routes…", "Comparing bus & train fares…", "Fitting your ₹ budget…", "Packing your checklist…"];
  let i = 0;
  setInterval(() => {
    const el = document.getElementById("sub-light");
    el.style.opacity = 0;
    setTimeout(() => { i = (i + 1) % texts.length; el.textContent = texts[i]; el.style.opacity = 1; }, 300);
  }, 2000);
</script>
</body>
</html>
